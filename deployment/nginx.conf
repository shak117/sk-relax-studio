# =============================================================================
# SK RELAX BEAUTY ACADEMY & SALON — NGINX PRODUCTION CONFIGURATION
# Prepared by: Cloud Technologies
# Target Domain: https://skrelaxbeauty.com & https://www.skrelaxbeauty.com
# Path: /etc/nginx/sites-available/skrelaxbeauty.com
# =============================================================================

# Rate Limiting Zone: 5 requests per minute on login endpoint to deter brute-force
limit_req_zone $binary_remote_addr zone=skrelax_admin_login:10m rate=5r/m;

# -----------------------------------------------------------------------------
# 1. HTTP Server — Redirect all HTTP requests to HTTPS (301 Permanent Redirect)
# -----------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name skrelaxbeauty.com www.skrelaxbeauty.com;

    # Let's Encrypt ACME Challenge verification directory
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://skrelaxbeauty.com$request_uri;
    }
}

# -----------------------------------------------------------------------------
# 2. HTTPS Server — Main Production Application
# -----------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name skrelaxbeauty.com www.skrelaxbeauty.com;

    # Canonical redirect www -> non-www
    if ($host = 'www.skrelaxbeauty.com') {
        return 301 https://skrelaxbeauty.com$request_uri;
    }

    # SSL Certificates (managed automatically by Certbot / Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/skrelaxbeauty.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/skrelaxbeauty.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/sk-relax-studio/dist;
    index index.html;

    # Upload Limit: 60MB for high-resolution salon flyers and short video reels
    client_max_body_size 60M;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Gzip Compression for text/code assets
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # -------------------------------------------------------------------------
    # A. Dedicated Rate-Limited Admin Login Proxy
    # -------------------------------------------------------------------------
    location = /api/admin/login {
        limit_req zone=skrelax_admin_login burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # -------------------------------------------------------------------------
    # B. API Proxy — Forward all /api/ requests to Node.js backend on port 3000
    # -------------------------------------------------------------------------
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # -------------------------------------------------------------------------
    # C. Uploaded Media & Video Streaming (HTTP 206 Partial Content enabled)
    # -------------------------------------------------------------------------
    location /uploads/ {
        alias /var/www/sk-relax-studio/public/uploads/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        add_header Access-Control-Allow-Origin "*";
        add_header Accept-Ranges bytes;
        try_files $uri =404;
    }

    # -------------------------------------------------------------------------
    # D. Static Bundled Assets (Vite hash-versioned JS/CSS/Fonts)
    # -------------------------------------------------------------------------
    location /assets/ {
        alias /var/www/sk-relax-studio/dist/assets/;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # -------------------------------------------------------------------------
    # E. Public Static Files (Favicons, Robots, Sitemap)
    # -------------------------------------------------------------------------
    location = /robots.txt {
        root /var/www/sk-relax-studio/public;
        access_log off;
        log_not_found off;
    }

    location = /sitemap.xml {
        root /var/www/sk-relax-studio/public;
        access_log off;
        log_not_found off;
    }

    # -------------------------------------------------------------------------
    # F. SPA Frontend Routing Fallback
    # -------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate";
    }
}
