# =============================================================================
# SK RELAX BEAUTY ACADEMY & SALON — INITIAL HTTP BOOTSTRAP CONFIGURATION (Pre-SSL)
# Prepared by: Cloud Technologies
# Target Domain: https://skrelaxbeauty.com & https://www.skrelaxbeauty.com
# Path: /etc/nginx/sites-available/skrelaxbeauty.com
#
# Use this configuration during initial VPS provisioning so Nginx starts cleanly
# on Port 80, allowing Certbot to complete ACME HTTP-01 domain challenge.
# Once Certbot runs, it automatically provisions SSL and upgrades to HTTPS.
# =============================================================================

limit_req_zone $binary_remote_addr zone=skrelax_admin_login:10m rate=5r/m;

server {
    listen 80;
    listen [::]:80;
    server_name skrelaxbeauty.com www.skrelaxbeauty.com;

    root /var/www/sk-relax-studio/dist;
    index index.html;

    client_max_body_size 60M;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript image/svg+xml;

    # Let's Encrypt ACME Challenge verification directory
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Dedicated Rate-Limited Admin Login Proxy
    location = /api/admin/login {
        limit_req zone=skrelax_admin_login burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API Reverse Proxy
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Uploaded Media & Video Streaming (HTTP 206 Partial Content)
    location /uploads/ {
        alias /var/www/sk-relax-studio/public/uploads/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        add_header Access-Control-Allow-Origin "*";
        add_header Accept-Ranges bytes;
        try_files $uri =404;
    }

    # Static Bundled Assets
    location /assets/ {
        alias /var/www/sk-relax-studio/dist/assets/;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Public Static Files
    location = /robots.txt {
        root /var/www/sk-relax-studio/public;
        access_log off;
        log_not_found off;
    }

    location = /sitemap.xml {
        root /var/www/sk-relax-studio/public;
        access_log off;
        log_not_found off;
    }

    # SPA Routing Fallback
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate";
    }
}
