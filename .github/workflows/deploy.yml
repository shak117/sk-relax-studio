name: SK RELAX Production Deployment CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Ensure only one deployment executes at a time to prevent race conditions
concurrency:
  group: production-deployment
  cancel-in-progress: false

# Global environment variables (Non-secret production configuration)
env:
  VPS_HOST: skrelaxbeautysalonandacademy.cloud
  VPS_PORT: '22'
  VPS_USER: deploy
  TARGET_DIR: /var/www/sk-relax-studio
  SITE_URL: https://skrelaxbeautysalonandacademy.cloud

jobs:
  # =========================================================================
  # JOB 1: Test, Verify & Build Frontend/Backend Artifacts
  # =========================================================================
  build-and-verify:
    name: Build & Verify Artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 20
          cache: 'npm'

      - name: Clean Dependency Installation
        run: npm ci

      - name: Strict TypeScript Compilation Check
        run: npx tsc --noEmit

      - name: Compile Production Build
        run: npm run build
        env:
          VITE_SITE_URL: ${{ env.SITE_URL }}

      - name: Validate Build Output
        run: |
          if [ ! -f "dist/index.html" ]; then
            echo "::error::Build verification failed! dist/index.html is missing."
            exit 1
          fi
          echo "Production build successfully verified. Build size: $(du -sh dist/ | cut -f1)"

      - name: Archive Built Artifacts
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: production-dist
          path: dist/
          retention-days: 1

  # =========================================================================
  # JOB 2: Deploy to Hostinger Ubuntu VPS via Secure Helper
  # =========================================================================
  deploy:
    name: Deploy to Production VPS
    needs: build-and-verify
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download Built Artifacts
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: production-dist
          path: dist/

      - name: Configure Secure SSH Authentication & Pre-Verified Host Key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          # 1. Install private SSH key
          echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          # 2. Install pre-verified SSH known_hosts (prevents MITM attacks without blind scanning)
          if [ -z "$SSH_KNOWN_HOSTS" ]; then
            echo "::error::Secret VPS_SSH_KNOWN_HOSTS is not configured! Blind scanning is rejected for security."
            exit 1
          fi

          echo "$SSH_KNOWN_HOSTS" | tr -d '\r' > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

          # Validate known_hosts entry syntax
          ssh-keygen -l -f ~/.ssh/known_hosts || {
            echo "::error::Configured VPS_SSH_KNOWN_HOSTS contains an invalid host key entry."
            exit 1
          }

      - name: Create Pre-Deployment Release Snapshot on VPS
        run: |
          echo "Triggering pre-deployment snapshot of running application code on $VPS_HOST..."
          ssh -p $VPS_PORT -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=yes -o BatchMode=yes "$VPS_USER@$VPS_HOST" \
            "sudo /usr/local/bin/skrelax-deploy.sh --pre-backup"

      - name: Synchronize Application Code via Rsync
        run: |
          echo "Synchronizing verified files to $VPS_USER@$VPS_HOST:$TARGET_DIR..."

          # Synchronize code files only.
          # Explicitly exclude and protect customer data, database JSON, and environment configuration.
          rsync -avz \
            -e "ssh -p $VPS_PORT -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=yes -o BatchMode=yes" \
            --exclude='.env' \
            --exclude='server/data/' \
            --exclude='public/uploads/' \
            --exclude='node_modules/' \
            --exclude='.git/' \
            --exclude='*.log' \
            --filter='P .env' \
            --filter='P server/data/***' \
            --filter='P public/uploads/***' \
            ./ "$VPS_USER@$VPS_HOST:$TARGET_DIR/"

          echo "Rsync completed successfully. Customer uploads and databases remain untouched."

      - name: Execute Root Deployment Helper via Sudo
        run: |
          echo "Invoking scoped root deployment helper on $VPS_HOST..."

          # Execute the narrowly-scoped deployment script via sudo.
          # The deploy user has permission ONLY for this script, with zero access to root PM2 or other clients.
          ssh -p $VPS_PORT -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=yes -o BatchMode=yes "$VPS_USER@$VPS_HOST" \
            "sudo /usr/local/bin/skrelax-deploy.sh"

      - name: External Public Health Check
        run: |
          echo "Verifying public domain endpoint: $SITE_URL/api/health"
          
          # Allow 5 seconds for proxy and cache propagation
          sleep 5

          PUBLIC_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$SITE_URL/api/health" || echo "000")
          echo "Public Health Check Response: HTTP $PUBLIC_STATUS"

          if [ "$PUBLIC_STATUS" -ne 200 ]; then
            echo "::error::Public health check failed with HTTP $PUBLIC_STATUS! The application is not responding normally."
            exit 1
          fi

          echo "Deployment successfully verified healthy at $SITE_URL."
